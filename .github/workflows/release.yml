name: bundle

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      - name: Validate
        run: make validate
      - name: Build bundle
        run: make bundle
      - name: Check the tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(jq -r .version plugin/.claude-plugin/plugin.json)" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/*.zip
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
